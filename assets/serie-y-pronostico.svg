  <title id="t">Serie nacional de casos registrados de 2000 a 2023, de 5.2 a 15.8 millones, con caídas en 2005-2006 y en 2020. Pronóstico para 2025: Prophet 15.6 millones, ARIMA 14.8 millones.</title>
