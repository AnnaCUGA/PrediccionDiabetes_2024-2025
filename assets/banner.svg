<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t">
  <title id="t">Predicción de diabetes en México con ARIMA y Prophet: 15.6 millones pronosticados para 2025 a partir de 24 años de datos de los 32 estados.</title>
  <defs>
    <pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#aaa3cd" opacity="0.16"/></pattern>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="m"><rect width="1200" height="360" rx="20"/></clipPath>
    <style>
      .k { font: 600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7fe0c9; }
      .h { font: 800 56px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #edeafb; letter-spacing: -1.5px; }
      .num { font: 800 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7fe0c9; }
      .lab { font: 400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .ti { font: 700 22px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #edeafb; }
      .kn { font: 600 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #edeafb; }
      .sm { font: 400 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .val { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #edeafb; }
      .ax { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #aaa3cd; }
      .lg { font: 400 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #aaa3cd; }
      .bar { transform-box: fill-box; transform-origin: left; animation: gx 1.1s cubic-bezier(.2,.7,.2,1) both; }
      .col { transform-box: fill-box; transform-origin: bottom; animation: gy 1.1s cubic-bezier(.2,.7,.2,1) both; }
      .draw { stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: dr 2.6s ease-out forwards; }
      .late { opacity: 0; animation: fade .5s ease-out 2.3s forwards; }
      @keyframes gx { from { transform: scaleX(0) } to { transform: scaleX(1) } }
      @keyframes gy { from { transform: scaleY(0) } to { transform: scaleY(1) } }
      @keyframes dr { to { stroke-dashoffset: 0 } }
      @keyframes fade { to { opacity: 1 } }
    </style>
  </defs>
  <g clip-path="url(#m)">
    <rect width="1200" height="360" fill="#15122a"/>
    <circle cx="180" cy="40" r="170" fill="#ff9a8b" opacity="0.18" filter="url(#b)"><animate attributeName="cx" values="180;360;180" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="340" r="190" fill="#7fe0c9" opacity="0.15" filter="url(#b)"><animate attributeName="cx" values="1000;840;1000" dur="20s" repeatCount="indefinite"/></circle>
    <rect width="1200" height="360" fill="url(#p)"/>
  </g>
  <rect x="64" y="50" width="357" height="34" rx="17" fill="#1f1b3a" stroke="#373063"/>
  <text class="k" x="84" y="73">Series de tiempo con ARIMA y Prophet</text>
  <text class="h" x="62" y="146">Predicción de diabetes</text>
  <text class="h" x="62" y="206">en México, 2000–2025</text>
  <text class="num" x="64" y="270">15.6 M</text><text class="lab" x="64" y="298">pronóstico para 2025</text><text class="num" x="292.0" y="270">24</text><text class="lab" x="292.0" y="298">años de datos</text><text class="num" x="459.8" y="270">32</text><text class="lab" x="459.8" y="298">estados</text>
  <g transform="translate(872 90)"><path class="draw" d="M0.0 132.0 L10.0 131.5 L20.0 130.1 L30.0 120.8 L40.0 114.1 L50.0 169.3 L60.0 159.6 L70.0 128.7 L80.0 112.8 L90.0 106.7 L100.0 92.4 L110.0 78.6 L120.0 64.8 L130.0 57.0 L140.0 78.5 L150.0 47.9 L160.0 29.5 L170.0 34.8 L180.0 37.4 L190.0 47.1 L200.0 108.8 L210.0 75.3 L220.0 43.1 L230.0 13.4" fill="none" stroke="#7fe0c9" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path class="late" d="M230.0 13.4 L240.0 20.5 L250.0 15.5" fill="none" stroke="#ff9a8b" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/><circle class="late" cx="250.0" cy="15.5" r="6" fill="#ff9a8b"/><line x1="0" y1="190.5" x2="250" y2="190.5" stroke="#373063"/><text class="ax" x="0" y="210">2000</text><text class="ax" x="250" y="210" text-anchor="end">2025</text></g>
</svg>
